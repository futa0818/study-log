{% extends 'base.html' %}

{% block content %}
<div class="card detail-card category-{{ log.category | lower }}">
    <!-- 補足要望：ヘッダーの下線（短い線）が重複しないようスッキリさせています -->
    <div class="detail-header-clean">
        <h2>学習ログ詳細</h2>
        <!-- PC画面用：IDの代わりに右上に表示する日付 -->
        <span class="log-date-badge pc-only">{{ log.study_date }}</span>
    </div>

    <div class="detail-content">
        <div class="detail-item">
            <div class="detail-label-row">
                <span class="detail-label">タイトル</span>
                <!-- スマホ画面用：タイトルの右端に配置する日付 -->
                <span class="log-date-badge mobile-only">{{ log.study_date }}</span>
            </div>
            <p class="detail-value title-text">{{ log.title }}</p>
        </div>

        <div class="detail-item">
            <span class="detail-label">カテゴリ</span>
            <p class="detail-value"><span class="category-tag">{{ log.category }}</span></p>
        </div>

        <div class="detail-item">
            <span class="detail-label">学習時間</span>
            <p class="detail-value time-text">{{ log.study_time }}分</p>
        </div>

        <div class="detail-item">
            <span class="detail-label">本文</span>
            <div class="detail-value body-text">{{ log.body }}</div>
        </div>
    </div>

    <div class="detail-actions">
        <a href="/logs" class="btn-back">一覧に戻る</a>
    </div>
</div>
{% endblock %}
